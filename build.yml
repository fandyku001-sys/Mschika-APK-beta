name: Build Mschika APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project ZIP
        run: |
          test -f Mschika_APK_Test_WebBuild.zip
          unzip -o Mschika_APK_Test_WebBuild.zip

      - name: Build debug APK
        working-directory: Mschika_APK_Test
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mschika-debug-APK
          path: Mschika_APK_Test/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
